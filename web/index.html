<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MandateGuard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <div>
            <p class="brand-name">MandateGuard</p>
            <p class="brand-sub">Base · USDC · AgentKit turnstile</p>
          </div>
        </div>
        <div class="meta" id="phase-label">Phase 1 · Set mandate</div>
      </header>

      <main class="layout">
        <section class="chat-panel" aria-label="Dialog">
          <div class="messages" id="messages"></div>

          <form class="composer" id="composer">
            <label class="sr-only" for="input">Message</label>
            <textarea
              id="input"
              rows="2"
              placeholder="Describe spending rules for your agent…"
              autocomplete="off"
            ></textarea>
            <div class="composer-actions">
              <button type="button" class="ghost" id="btn-example">Example mandate</button>
              <button type="submit" class="primary" id="btn-send">Send</button>
            </div>
          </form>
        </section>

        <aside class="side" aria-label="Policy and spend status">
          <div class="card">
            <h2>Active policy</h2>
            <pre id="policy-view" class="code">No policy yet.</pre>
          </div>
          <div class="card">
            <h2>Today’s ledger</h2>
            <p id="ledger-view" class="ledger">$0.00 spent</p>
          </div>
          <div class="card hints">
            <h2>Dialog roles</h2>
            <ul>
              <li><strong>You</strong> — owner, set rules / confirm</li>
              <li><strong>MandateGuard</strong> — compiles & gates</li>
              <li><strong>Spender</strong> — AgentKit agent proposing spends</li>
            </ul>
          </div>
        </aside>
      </main>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>

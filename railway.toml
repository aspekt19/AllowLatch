# Always-on OpenServ fallback host (not the Vercel site gate).
# Dashboard: New Project → Deploy from GitHub → Dockerfile
# Or CLI: npm i -g @railway/cli && railway login && railway up
#
# Required env in Railway:
#   SERV_API_KEY, OPENSERV_API_KEY, OPENSERV_AUTH_TOKEN, OPENSERV_USER_API_KEY,
#   WALLET_PRIVATE_KEY, DISABLE_TUNNEL=true
#   PORT=<same as Networking port, often 8080>
#   ALLOWLATCH_HOST_URL=https://….up.railway.app  (so provision keeps endpointUrl)
# Also once: ALLOWLATCH_HOST_URL=… npm run host:point (from laptop)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
